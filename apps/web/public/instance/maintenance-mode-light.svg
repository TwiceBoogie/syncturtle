<svg xmlns="http://www.w3.org/2000/svg" width="595" height="300" viewBox="0 0 595 300" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SyncTurtle maintenance illustration — light theme</title>
  <desc id="description">A floating SyncTurtle application window connects to a layered service module while its Unified symbol remains active.</desc>

  <!-- Quiet ground shadows and synchronization path. The canvas itself is transparent. -->
  <g id="ground" fill="#092C2B">
    <ellipse cx="246" cy="250" rx="148" ry="13" opacity=".045"/>
    <ellipse cx="431" cy="258" rx="100" ry="12" opacity=".055"/>
    <ellipse cx="290" cy="261" rx="202" ry="8" opacity=".025"/>
  </g>
  <g id="connection-paths" stroke="#78A795" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 6" opacity=".75">
    <path d="M69 198 C89 198 97 183 115 183 H126"/>
    <path d="M347 171 C369 171 374 188 396 188"/>
    <path d="M500 193 C522 193 525 174 544 174"/>
  </g>
  <g id="connection-points" fill="#35C482">
    <circle cx="69" cy="198" r="3" opacity=".65"/>
    <circle cx="347" cy="171" r="3.4"/>
    <circle cx="396" cy="188" r="3.4"/>
    <circle cx="544" cy="174" r="3" opacity=".65"/>
  </g>

  <!-- Small orbiting hardware accents. -->
  <g id="floating-accents" stroke-linejoin="round">
    <path d="M86 105 L100 98 L114 105 L100 112 Z" fill="#F8FAF9" stroke="#9BB9AA" stroke-width="1.2"/>
    <path d="M86 105 V114 L100 121 V112 Z" fill="#D7E7DF" stroke="#9BB9AA" stroke-width="1.2"/>
    <path d="M100 112 L114 105 V114 L100 121 Z" fill="#BBD7C9" stroke="#9BB9AA" stroke-width="1.2"/>
    <path d="M100 102 V108 M97 105 H103" stroke="#35C482" stroke-width="1.4" stroke-linecap="round"/>

    <path d="M426 69 L445 60 L464 69 L445 78 Z" fill="#DDF5E8" stroke="#9BB9AA" stroke-width="1.2"/>
    <path d="M426 69 V82 L445 91 V78 Z" fill="#D7E7DF" stroke="#9BB9AA" stroke-width="1.2"/>
    <path d="M445 78 L464 69 V82 L445 91 Z" fill="#BBD7C9" stroke="#9BB9AA" stroke-width="1.2"/>
    <path d="M441 69 H449" stroke="#147D64" stroke-width="2" stroke-linecap="round"/>

    <path d="M494 97 L499 92 L504 97 L499 102 Z" fill="#35C482" opacity=".85"/>
    <path d="M75 142 H83 M79 138 V146" stroke="#6C9582" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="521" cy="126" r="2" fill="#6C9582"/>
  </g>

  <!-- Floating application window: oblique projection with measured 11px extrusion. -->
  <g id="application-window" stroke-linejoin="round">
    <path d="M137 45 L346 90 V222 L335 230 L126 185 V53 Z" fill="#BBD7C9" stroke="#6C9582" stroke-width="1.35"/>
    <path d="M126 53 L137 45 L346 90 L335 98 Z" fill="#D7E7DF" stroke="#6C9582" stroke-width="1.35"/>
    <path d="M335 98 L346 90 V222 L335 230 Z" fill="#BBD7C9" stroke="#6C9582" stroke-width="1.35"/>
    <path d="M126 53 L335 98 V230 L126 185 Z" fill="#FFFFFF" stroke="#6C9582" stroke-width="1.45"/>

    <path d="M126 53 L335 98 V121 L126 76 Z" fill="#F8FAF9" stroke="#6C9582" stroke-width="1.25"/>
    <path d="M126 76 L335 121" stroke="#C6DCD1" stroke-width="1"/>
    <circle cx="143" cy="67" r="2.3" fill="#35C482"/>
    <circle cx="153" cy="69.2" r="2.3" fill="#9BB9AA"/>
    <circle cx="163" cy="71.4" r="2.3" fill="#9BB9AA" opacity=".6"/>
    <path d="M280 98 L314 105.5" stroke="#C6DCD1" stroke-width="2.3" stroke-linecap="round"/>

    <path d="M137 90 L323 130 V214 L137 174 Z" fill="#F3FBF6" stroke="#C6DCD1" stroke-width="1.15"/>
    <path d="M155 110 L253 131 V190 L155 169 Z" fill="#F8FAF9" stroke="#C6DCD1" stroke-width="1"/>
    <path d="M155 169 L253 190" stroke="#C6DCD1" stroke-width="1"/>

    <!-- These two path data strings are read verbatim from the approved Unified symbol SVG. -->
    <g id="approved-unified-symbol" transform="matrix(1.14 .245 0 .83 155 89)" fill="#35C482">
      <path id="unified-upper-fold" d="M18 20 H69 L78 29 V42 H65 V33 L61 32 H31 V45 H18 Z"/>
      <path id="unified-lower-fold" d="M78 76 H27 L18 67 V54 H31 V63 L35 64 H65 V51 H78 Z"/>
    </g>

    <path d="M270 143 L302 150" stroke="#147D64" stroke-width="3" stroke-linecap="round"/>
    <path d="M270 155 L310 164" stroke="#9DBBAE" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M270 167 L294 172" stroke="#9DBBAE" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M270 189 L280 191.3 L280 198 L270 195.7 Z" fill="#35C482" opacity=".88"/>
    <path d="M286 193 L296 195.3 L296 202 L286 199.7 Z" fill="#C6DCD1"/>
    <path d="M302 196.5 L312 198.8 L312 205.5 L302 203.2 Z" fill="#C6DCD1"/>
  </g>

  <!-- Stacked service deck and calibration core, linked to the application window. -->
  <g id="service-module" stroke-linejoin="round">
    <path d="M352 205 L430 168 L512 205 L434 243 Z" fill="#BBD7C9" opacity=".15"/>
    <path d="M352 207 L430 170 L512 207 L434 245 Z" fill="#BBD7C9" stroke="#6C9582" stroke-width="1.25"/>
    <path d="M352 207 L434 245 V255 L352 217 Z" fill="#D7E7DF" stroke="#6C9582" stroke-width="1.25"/>
    <path d="M434 245 L512 207 V217 L434 255 Z" fill="#BBD7C9" stroke="#6C9582" stroke-width="1.25"/>

    <path d="M369 195 L430 165 L495 195 L434 225 Z" fill="#F8FAF9" stroke="#6C9582" stroke-width="1.2"/>
    <path d="M369 195 L434 225 V234 L369 204 Z" fill="#D7E7DF" stroke="#6C9582" stroke-width="1.1"/>
    <path d="M434 225 L495 195 V204 L434 234 Z" fill="#BBD7C9" stroke="#6C9582" stroke-width="1.1"/>

    <path d="M392 183 L430 164 L472 183 L434 202 Z" fill="#F3FBF6" stroke="#C6DCD1" stroke-width="1.1"/>
    <ellipse cx="432" cy="184" rx="28" ry="12.6" fill="#BBD7C9" stroke="#6C9582" stroke-width="1.1"/>
    <ellipse cx="432" cy="181" rx="22" ry="9.5" fill="#F8FAF9" stroke="#6C9582" stroke-width="1.1"/>
    <ellipse cx="432" cy="181" rx="13" ry="5.5" fill="#35C482" opacity=".28" stroke="#35C482" stroke-width="1.1"/>
    <path d="M426 181 L430 184 L439 178" stroke="#35C482" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M379 194 L389 189 L398 193.5 L388 198.5 Z" fill="#35C482" opacity=".72"/>
    <path d="M468 207 L477 202.5 L486 207 L477 211.5 Z" fill="#35C482" opacity=".72"/>
    <path d="M376 211 L388 216 M394 219 L404 223" stroke="#6C9582" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M462 239 L472 234 M478 231 L487 226.5" stroke="#6C9582" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
