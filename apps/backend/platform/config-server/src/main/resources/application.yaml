server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    group:
      local:
        - native
      docker:
        - native

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
