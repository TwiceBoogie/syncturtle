eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
