eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/syncturtle_instance
    username: instance_svc
    password: ${INSTANCE_DB_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
