server:
  port: 8000

spring:
  main:
    web-application-type: reactive
  reactor:
    context-propagation: auto

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8002/.well-known/jwks.json"

  cache:
    type: caffeine

  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
        disable-time-limiter: true

    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          observability:
            enabled: true

          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

          httpclient:
            connect-timeout: 5000
            response-timeout: 5s
            compression: true
            pool:
              type: fixed
              maxConnections: 200
              acquire-timeout: 2000
              maxIdleTime: 5m
              maxLifeTime: 5m
              eviction-interval: 2m
              leasing-strategy: lifo
              metrics: true

          routes:
            - id: auth-endpoints
              uri: lb://user-service
              predicates:
                - Path=/auth/**

            - id: instance-root-public
              uri: lb://instance-service
              predicates:
                - Path=/api/instances,/api/instances/
                - Method=GET,OPTIONS,HEAD
              filters:
                - name: CircuitBreaker
                  args:
                    name: instanceServiceCB
                    fallbackUri: forward:/__fallback/instance-service
                    statusCodes:
                      - 502
                      - 503
                      - 504

            - id: instance-admin-session
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/admins/session,/api/instances/admins/session/
                - Method=GET,OPTIONS,HEAD

            - id: instance-admin-sign-in
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/admins/sign-in,/api/instances/admins/sign-in/
                - Method=POST,OPTIONS

            - id: instance-admin-sign-up
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/admins/sign-up,/api/instances/admins/sign-up/
                - Method=POST,OPTIONS

            # INSTANCE: PROTECTED
            - id: instance-admin-sign-out-rewrite
              uri: lb://user-service
              predicates:
                - Path=/api/instances/admins/sign-out/**
                - Method=POST,OPTIONS
              filters:
                - RewritePath=/api/instances/admins/sign-out, /auth/sign-out
                - AddRequestHeader=X-ST-Internal-Logout-CTX, ADMIN
                - name: AuthenticatedHeaders

            - id: instance-workspace-protected
              uri: lb://workspace-service
              predicates:
                - Path=/api/instances/workspaces/**
              filters:
                - name: AuthenticatedHeaders

            - id: instance-email-credentials-check
              uri: lb://email-service
              predicates:
                - Path=/api/instances/email-credentials-check/**
                - Method=POST
              metadata:
                response-timeout: 15000
                connect-timeout: 5000
              filters:
                - name: AuthenticatedHeaders

            - id: instance-protected
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/admins/**, /api/instances/configurations/**
                - Method=GET,OPTIONS,HEAD,DELETE
              filters:
                - name: AuthenticatedHeaders

            - id: instance-admin-post
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/**
                - Method=POST

            - id: instance-admin-patch
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/**
                - Method=PATCH
              filters:
                - name: AuthenticatedHeaders

    loadbalancer:
      cache:
        enabled: true
        eager-load:
          clients: instance-service
        caffeine:
          spec: maximumSize=500,expireAfterWrite=30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      instanceServiceCB:
        baseConfig: default

app:
  passport:
    gateway:
      issuer: "https://api.syncturtle.com/auth"
      audience: "syncturtle-api"
      access-cookie-name: "passport"
      auth-header-prefix: "X-Auth-"
      redis:
        session-key-prefix: "auth:session:"
        user-version-key-prefix: "auth:user-version:"
  gateway:
    session:
      redisKeyPrefix: st
      sessionTtl: 30m
      absoluteTtl: 30d
      renewWhenRemainingFraction: 0.25
      cookie:
        httpOnly: true
        secure: false
        sameSite: Lax
        path: /
        domain: ""
  security:
    encryption:
      secret-key: ${APP_SECURITY_ENCRYPTION_SECRET_KEY}
    csrf:
      enabled: true
      hmac-algorithm: ${APP_SECURITY_CSRF_HMAC_ALGORITHM:HmacSHA256}
      signing-key: ${APP_SECURITY_CSRF_SIGNING_KEY}
      transport:
        cookie-name: csrf
        header-name: X-CSRF-Token
        form-field-name: csrfmiddlwaretoken
      cookie-policy:
        http-only: true
        secure: false
        same-site: Lax
        path: /
        domain: ""
        max-age: 30m
