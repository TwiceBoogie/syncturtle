server:
  port: 8000

spring:
  main:
    web-application-type: reactive
  reactor:
    context-propagation: auto

  cache:
    type: caffeine

  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
        disable-time-limiter: true

    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          observability:
            enabled: true

          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

          httpclient:
            connect-timeout: 5000
            response-timeout: 5s
            compression: true
            pool:
              type: fixed
              maxConnections: 200
              acquire-timeout: 2000
              maxIdleTime: 5m
              maxLifeTime: 5m
              eviction-interval: 2m
              leasing-strategy: lifo
              metrics: true

          routes:
            - id: instance-public
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/**
                - Method=GET,OPTIONS,HEAD
              filters:
                - name: CircuitBreaker
                  args:
                    name: instanceServiceCB
                    fallbackUri: forward:/__fallback/instance-service
                    statusCodes:
                      - 502
                      - 503
                      - 504

            - id: instance-admin-write
              uri: lb://instance-service
              predicates:
                - Path=/api/instances/**
                - Method=PATCH
              filters:
                - name: SessionValidate
                  args:
                    required: true
                    cookieName: session
                    sessionType: USER

    loadbalancer:
      cache:
        enabled: true
        eager-load:
          clients: instance-service
        caffeine:
          spec: maximumSize=500,expireAfterWrite=30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      instanceServiceCB:
        baseConfig: default

app:
  gateway:
    session:
      redisKeyPrefix: st
      sessionTtl: 30m
      absoluteTtl: 30d
      renewWhenRemainingFraction: 0.25
      cookie:
        httpOnly: true
        secure: false
        sameSite: Lax
        path: /
        domain: ""
