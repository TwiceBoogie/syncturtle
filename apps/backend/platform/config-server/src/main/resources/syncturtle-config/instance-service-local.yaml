spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/syncturtle_instance
    username: instance_app
    password: instance_app_dev

  liquibase:
    user: instance_migrator
    password: instance_migrator_dev

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:syncturtle_redis_dev_password}

app:
  services:
    instance-service:
      base-url: http://localhost:8001
    user-service:
      base-url: http://localhost:8002
    workspace-service:
      base-url: http://localhost:8003
    email-service:
      base-url: http://localhost:8020
    file-service:
      base-url: http://localhost:8004
