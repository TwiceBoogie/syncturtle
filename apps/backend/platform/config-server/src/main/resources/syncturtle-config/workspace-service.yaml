server:
  port: ${SERVER_PORT:8003}

spring:
  application: workspace-service

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      auto-startup: ${app.kafka.enabled:true}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 32768
        compression.type: zstd
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false # JsonSerializer.ADD_TYPE_INFO_HEADERS
        interceptor.classes: com.syncturtle.common.spring.autoconfigure.observability.kafka.MdcKafkaHeaderProducerInterceptor
    consumer:
      auto-offset-reset: earliest

jdbc:
  datasource-proxy:
    enabled: true
    include-parameter-values: false
  includes: QUERY

app:
  kafka:
    enabled: true
    error-handling:
      initial-interval: 500ms
      multiplier: 2.0
      max-elapsed-time: 8s
      dlt-suffix: ".DLT"
      ack-after-handle: true
      commit-recovered: true
      log-retries: true
  security:
    csrf:
      enabled: false
