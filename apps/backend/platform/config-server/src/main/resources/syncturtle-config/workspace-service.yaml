server:
  port: ${SERVER_PORT:8003}

spring:
  application:
    name: workspace-service
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      acks: all
      batch-size: 32768
      compression.type: zstd
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false # JsonSerializer.ADD_TYPE_INFO_HEADERS
    consumer:
      auto-offset-reset: earliest

jdbc:
  datasource-proxy:
    enabled: true
    include-parameter-values: false
  includes: QUERY

app:
  kafka:
    instance-configuration:
      deployment-id: ${app.kafka.deployment-id}
      replica-id: ${SYNCTURTLE_REPLICA_ID:${HOSTNAME:localhost}-${server.port}}
      local-replica-count: ${SYNCTURTLE_SERVICE_REPLICA_COUNT:1}
    error-handling:
      initial-interval: 500ms
      multiplier: 2.0
      max-elapsed-time: 8s
      log-retries: true
  workspace:
    runtime-cache:
      ttl: ${APP_WORKSPACE_RUNTIME_CACHE_TTL:1m}
  security:
    request-provenance:
      keys:
        signer:
          private-key-location: ${APP_SECURITY_REQUEST_PROVENANCE_WORKSPACE_SERVICE_PRIVATE_KEY_LOCATION}
          public-key-location: ${APP_SECURITY_REQUEST_PROVENANCE_WORKSPACE_SERVICE_PUBLIC_KEY_LOCATION}
        verification-public-key-locations:
          api-gateway:
            [
              "${APP_SECURITY_REQUEST_PROVENANCE_API_GATEWAY_PUBLIC_KEY_LOCATION}",
            ]
          instance-service:
            [
              "${APP_SECURITY_REQUEST_PROVENANCE_INSTANCE_SERVICE_PUBLIC_KEY_LOCATION}",
            ]
  web:
    errors:
      include-path: true
      include-trace-id: true
      include-debug: false
      include-stack-trace: false
      max-stack-trace-lines: 30
    access-logging:
      enabled: true
