server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: user-service
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s
      imperative:
        factory: jdk
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      auto-startup: ${app.kafka.enabled:true}
    producer:
      acks: all
      batch-size: 32768
      compression.type: zstd
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false # JsonSerializer.ADD_TYPE_INFO_HEADERS
    consumer:
      auto-offset-reset: earliest

jdbc:
  datasource-proxy:
    enabled: true
    include-parameter-values: false
  includes: QUERY

app:
  auth:
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:30d}
    password-reset-token-ttl: ${APP_AUTH_PASSWORD_RESET_TOKEN_TTL:30m}
    password-reset-token-bytes: ${APP_AUTH_PASSWORD_RESET_TOKEN_BYTES:48}
    runtime-cache:
      ttl: ${APP_AUTH_RUNTIME_CACHE_TTL:1m}
    runtime-secret-cache:
      ttl: ${APP_AUTH_RUNTIME_SECRET_CACHE_TTL:5m}
  kafka:
    enabled: true
    instance-configuration:
      enabled: true
      deployment-id: ${SYNCTURTLE_DEPLOYMENT_ID:compose}
      replica-id: ${SYNCTURTLE_REPLICA_ID:${HOSTNAME:localhost}-${server.port}}
      local-replica-count: ${SYNCTURTLE_SERVICE_REPLICA_COUNT:1}
    error-handling:
      initial-interval: 500ms
      multiplier: 2.0
      max-elapsed-time: 8s
      dlt-suffix: ".DLT"
      ack-after-handle: true
      commit-recovered: false
      log-retries: true
  security:
    csrf:
      enabled: true
      signing-key: ${APP_SECURITY_CSRF_SIGNING_KEY}
      form:
        enabled: true
    cookies:
      secure: ${APP_SECURITY_COOKIES_SECURE:false}
      host-prefix-enabled: ${APP_SECURITY_COOKIES_HOST_PREFIX_ENABLED:false}
      domain: ${APP_SECURITY_COOKIES_DOMAIN:}
      path: /
      access-same-site: Lax
      refresh-same-site: Lax
      csrf-same-site: Lax
      csrf-max-age: 3h
  gateway:
    context:
      enabled: true
  web:
    errors:
      include-path: true
      include-trace-id: true
      include-debug: false
      include-stack-trace: false
      max-stack-trace-lines: 30
    access-logging:
      enabled: true
  public:
    api:
      origin: ${APP_PUBLIC_API_ORIGIN:http://localhost:8000}
      base-path: ${APP_PUBLIC_API_BASE_PATH:/}
    user-app:
      origin: ${APP_PUBLIC_WEB_ORIGIN:http://localhost:3000}
      base-path: ${APP_PUBLIC_WEB_BASE_PATH:/}
    admin:
      origin: ${APP_PUBLIC_ADMIN_ORIGIN:http://localhost:3001}
      base-path: ${APP_PUBLIC_ADMIN_BASE_PATH:/god-mode/}
  passport:
    issuer: ${APP_PASSPORT_ISSUER}
    audience: ${APP_PASSPORT_AUDIENCE}
    kid: ${APP_PASSPORT_KID}
    private-key-location: "classpath:keys/jwt-private-key.pem"
    public-key-location: "classpath:keys/jwt-public-key.pem"
  dev-error:
    enabled: true
