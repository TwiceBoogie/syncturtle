spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/syncturtle_workspace
    username: workspace_app
    password: ${WORKSPACE_DB_PASSWORD}

  liquibase:
    user: workspace_migrator
    password: ${WORKSPACE_MIGRATOR_DB_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

app:
  services:
    instance-service:
      base-url: http://instance-service:8080
    user-service:
      base-url: http://user-service:8080
    workspace-service:
      base-url: http://workspace-service:8080
    email-service:
      base-url: http://email-service:8080
    file-service:
      base-url: http://file-service:8080
