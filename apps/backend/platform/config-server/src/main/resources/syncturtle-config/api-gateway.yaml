server:
  port: ${SERVER_PORT:8000}

spring:
  main:
    web-application-type: reactive
  reactor:
    context-propagation: auto

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${app.services.user-service.base-url}/.well-known/jwks.json

  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
        disable-time-limiter: true

    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          observability:
            enabled: true

          httpclient:
            connect-timeout: 5000
            response-timeout: 5s
            compression: true
            pool:
              type: fixed
              max-connections: 200
              acquire-timeout: 2000
              max-idle-time: 5m
              max-life-time: 5m
              eviction-interval: 2m
              leasing-strategy: lifo
              metrics: true

          routes:
            - id: auth-endpoints
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/**

            - id: instance-root-public
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances,/api/instances/
                - Method=GET,OPTIONS,HEAD
              filters:
                - name: CircuitBreaker
                  args:
                    name: instanceServiceCB
                    fallbackUri: forward:/__fallback/instance-service
                    statusCodes:
                      - 502
                      - 503
                      - 504

            - id: instance-admin-session
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/session,/api/instances/admins/session/
                - Method=GET,OPTIONS,HEAD

            - id: instance-admin-sign-in
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/sign-in,/api/instances/admins/sign-in/
                - Method=POST,OPTIONS

            - id: instance-admin-sign-up
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/sign-up,/api/instances/admins/sign-up/
                - Method=POST,OPTIONS

            # INSTANCE: PROTECTED
            - id: instance-admin-sign-out-rewrite
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/api/instances/admins/sign-out/**
                - Method=POST,OPTIONS
              filters:
                - RewritePath=/api/instances/admins/sign-out, /auth/sign-out
                - AddRequestHeader=X-ST-Internal-Logout-CTX, ADMIN
                - name: PassportAuthentication
                  args:
                    validate-session: true
                    validate-user-auth-version: true
                    validate-admin-session-version: true
                    require-session-id: true
                    require-instance-id: true

            - id: instance-workspace-protected
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/workspaces/**
              filters:
                - name: PassportAuthentication

            - id: instance-email-credentials-check
              uri: ${app.services.email-service.base-url}
              predicates:
                - Path=/api/instances/email-credentials-check/**
                - Method=POST
              metadata:
                response-timeout: 15000
                connect-timeout: 5000
              filters:
                - name: PassportAuthentication
                  args:
                    validate-admin-session-version: true

            - id: instance-protected
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/**, /api/instances/configurations/**
                - Method=GET,OPTIONS,HEAD,DELETE
              filters:
                - name: PassportAuthentication
                  args:
                    validate-admin-session-version: true

            - id: instance-admin-post
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/**
                - Method=POST
              filters:
                - name: PassportAuthentication
                  args:
                    validate-admin-session-version: true

            - id: instance-admin-patch
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/**
                - Method=PATCH
              filters:
                - name: PassportAuthentication
                  args:
                    validate-admin-session-version: true

            - id: user-workspace-get
              uri: ${app.services.workspace-service.base-url}
              predicates:
                - Path=/api/users/me/workspaces/**
                - Method=GET,OPTIONS,HEAD
              filters:
                - name: PassportAuthentication
                  args:
                    validate-session: true
                    validate-user-auth-version: true
                    validate-admin-session-version: false
                    require-session-id: true
                    require-instance-id: true

            - id: workspace-protected
              uri: ${app.services.workspace-service.base-url}
              predicates:
                - Path=/api/workspaces/**
              filters:
                - name: PassportAuthentication
                  args:
                    validate-admin-session-version: false

            - id: user-protected
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/api/users/**
              filters:
                - name: PassportAuthentication
                  args:
                    validate-admin-session-version: false

            - id: file-service-protected
              uri: ${app.services.file-service.base-url}
              predicates:
                - Path=/api/assets/**
              filters:
                - name: PassportAuthentication
                  args:
                    validate-admin-session-version: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      instanceServiceCB:
        baseConfig: default

app:
  passport:
    gateway:
      issuer: ${APP_PASSPORT_ISSUER}
      audience: ${APP_PASSPORT_AUDIENCE}
      auth-header-prefix: X-Auth-
      redis:
        session-key-prefix: "auth:session:"
        user-version-key-prefix: "auth:user-version:"
        admin-session-version-key-prefix: "auth:admin-session-version:"
  gateway:
    client-metadata:
      trusted-proxy-count: ${GATEWAY_TRUSTED_PROXY_COUNT:0}
    session:
      redisKeyPrefix: st
      sessionTtl: 30m
      absoluteTtl: 30d
      renewWhenRemainingFraction: 0.25
      cookie:
        httpOnly: true
        secure: false
        sameSite: Lax
        path: /
        domain: ""
  security:
    encryption:
      secret-key: ${APP_SECURITY_ENCRYPTION_SECRET_KEY}
    csrf:
      enabled: true
      signing-key: ${APP_SECURITY_CSRF_SIGNING_KEY}
    cookies:
      secure: ${APP_SECURITY_COOKIES_SECURE:false}
      host-prefix-enabled: ${APP_SECURITY_COOKIES_HOST_PREFIX_ENABLED:false}
      domain: ${APP_SECURITY_COOKIES_DOMAIN:}
      path: /
      access-same-site: Lax
      refresh-same-site: Lax
      csrf-same-site: Lax
      csrf-max-age: 30m
