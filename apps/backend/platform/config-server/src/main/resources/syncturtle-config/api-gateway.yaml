server:
  port: ${SERVER_PORT:8000}

spring:
  main:
    web-application-type: reactive
  reactor:
    context-propagation: auto

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${app.services.user-service.base-url}/.well-known/jwks.json

  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
        disable-time-limiter: true

    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          observability:
            enabled: true

          httpclient:
            connect-timeout: 5000
            response-timeout: 5s
            compression: true
            pool:
              type: fixed
              max-connections: 200
              acquire-timeout: 2000
              max-idle-time: 5m
              max-life-time: 5m
              eviction-interval: 2m
              leasing-strategy: lifo
              metrics: true

          routes:
            - id: auth-public-credential-endpoints
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/email-check,/auth/magic-generate,/auth/sign-in,/auth/sign-up,/auth/magic-sign-in,/auth/magic-sign-up,/auth/forgot-password,/auth/reset-password/**
                - Method=POST,OPTIONS
              metadata:
                security: PUBLIC

            - id: auth-public-oauth-endpoints
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/google,/auth/google/callback,/auth/github,/auth/github/callback,/auth/gitlab,/auth/gitlab/callback
                - Method=GET,OPTIONS,HEAD
              metadata:
                security: PUBLIC

            - id: auth-refresh-public
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/refresh,/auth/refresh/
                - Method=POST,OPTIONS
              metadata:
                security: PUBLIC

            - id: auth-admin-session-completion-public
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/admin/session,/auth/admin/session/
                - Method=GET,OPTIONS
              metadata:
                security: PUBLIC

            - id: auth-sign-out-public
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/sign-out,/auth/sign-out/
                - Method=POST,OPTIONS
              metadata:
                security: PUBLIC

            - id: auth-set-password-protected
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/set-password,/auth/set-password/
                - Method=POST,OPTIONS
              metadata:
                security: PROTECTED

            - id: instance-root-public
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances,/api/instances/
                - Method=GET,OPTIONS,HEAD
              metadata:
                security: PUBLIC
              filters:
                - name: CircuitBreaker
                  args:
                    name: instanceServiceCB
                    fallbackUri: forward:/__fallback/instance-service
                    statusCodes:
                      - 502
                      - 503
                      - 504

            - id: instance-admin-session-optional-auth
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/session,/api/instances/admins/session/
                - Method=GET,OPTIONS,HEAD
              metadata:
                security: OPTIONAL_AUTH

            - id: instance-admin-sign-in-public
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/sign-in,/api/instances/admins/sign-in/
                - Method=POST,OPTIONS
              metadata:
                security: PUBLIC

            - id: instance-admin-sign-up-public
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/sign-up,/api/instances/admins/sign-up/
                - Method=POST,OPTIONS
              metadata:
                security: PUBLIC

            - id: auth-admin-sign-out-public-rewrite
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/auth/admin/sign-out,/auth/admin/sign-out/
                - Method=POST,OPTIONS
              metadata:
                security: PUBLIC
              filters:
                - RewritePath=^/auth/admin/sign-out/?$, /auth/sign-out
                - AddRequestHeader=X-ST-Internal-Logout-CTX, ADMIN

            - id: instance-workspace-protected
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/workspaces/**
              metadata:
                security: PROTECTED

            - id: instance-email-credentials-check-protected
              uri: ${app.services.email-service.base-url}
              predicates:
                - Path=/api/instances/email-credentials-check/**
                - Method=POST
              metadata:
                security: PROTECTED
                response-timeout: 15000
                connect-timeout: 5000

            - id: instance-protected
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/admins/**,/api/instances/configurations/**
                - Method=GET,OPTIONS,HEAD,DELETE
              metadata:
                security: PROTECTED

            - id: instance-admin-post-protected
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/**
                - Method=POST
              metadata:
                security: PROTECTED

            - id: instance-admin-patch-protected
              uri: ${app.services.instance-service.base-url}
              predicates:
                - Path=/api/instances/**
                - Method=PATCH
              metadata:
                security: PROTECTED

            - id: user-workspace-get-protected
              uri: ${app.services.workspace-service.base-url}
              predicates:
                - Path=/api/users/me/workspaces/**
                - Method=GET,OPTIONS,HEAD
              metadata:
                security: PROTECTED

            - id: workspace-protected
              uri: ${app.services.workspace-service.base-url}
              predicates:
                - Path=/api/workspaces/**
              metadata:
                security: PROTECTED

            - id: user-protected
              uri: ${app.services.user-service.base-url}
              predicates:
                - Path=/api/users/**
              metadata:
                security: PROTECTED

            - id: file-service-protected
              uri: ${app.services.file-service.base-url}
              predicates:
                - Path=/api/assets/**
              metadata:
                security: PROTECTED

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      instanceServiceCB:
        baseConfig: default

app:
  passport:
    gateway:
      issuer: ${APP_PASSPORT_ISSUER}
      audience: ${APP_PASSPORT_AUDIENCE}
      auth-header-prefix: X-Auth-
  gateway:
    client-metadata:
      trusted-proxy-count: ${GATEWAY_TRUSTED_PROXY_COUNT:0}
    csrf:
      pre-auth-lifetime: 30m
      session-max-lifetime: 7d
      nonce-bytes: 32
      max-signed-token-chars: 2048
      max-payload-bytes: 1024
  security:
    encryption:
      secret-key: ${APP_SECURITY_ENCRYPTION_SECRET_KEY}
    csrf:
      enabled: true
      signing-key: ${APP_SECURITY_CSRF_SIGNING_KEY}
    cookies:
      secure: ${APP_SECURITY_COOKIES_SECURE:false}
      managed-prefix-enabled: ${APP_SECURITY_COOKIES_MANAGED_PREFIX_ENABLED:false}
      access-same-site: Lax
      refresh-same-site: Lax
      csrf-same-site: Lax
      csrf-max-age: 30m
