management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    sampling:
      probability: 0.05
    baggage:
      remote-fields:
        - X-Correlation-Id
      # Optional
      # - X-Request-Id
      correlation:
        fields:
          - X-Correlation-Id
        # Optional
        # - X-Request-Id
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:14317}
      transport: grpc
    metrics:
      export:
        url: ${OTLP_METRICS_URL:http://localhost:14318/v1/metrics}
        enabled: true
        step: 10s
    logging:
      endpoint: ${OTLP_LOGS_ENDPOINT:http://localhost:14317}
      transport: grpc
  opentelemetry:
    resource-attributes:
      "[service.name]": ${spring.application.name}
      "[service.namespace]": syncturtle
      "[deployment.environment]": ${DEPLOYMENT_ENV:local}
      "[telemetry.mode]": "system"

logging:
  pattern:
    correlation: "[trace=%X{traceId:-},span=%X{spanId:-},corr=%X{X-Correlation-Id:-},req=%X{X-Request-Id:-}] "

app:
  env: ${DEPLOYMENT_ENV:local}
  redis:
    keys:
      key-prefix: ${APP_REDIS_KEY_PREFIX:st:${app.env}:}
  response-cache:
    enabled: ${APP_RESPONSE_CACHE_ENABLED:true}
    key-prefix: ${APP_RESPONSE_CACHE_KEY_PREFIX:${app.redis.keys.key-prefix}rc:}
    hash-bytes: ${APP_RESPONSE_CACHE_HASH_BYTES:16}
    body-type-allowlist-prefix: com.syncturtle.
    workspace-header-name: X-Workspace-Id
