spring:
  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5432/syncturtle_user
    username: user_app
    password: ${USER_DB_PASSWORD}

  liquibase:
    user: user_migrator
    password: ${USER_MIGRATOR_DB_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

server:
  error:
    include-exception: true
    include-message: always
    include-stacktrace: always
    include-binding-errors: always

app:
  dev-error:
    base-package: com.syncturtle
    source-roots: src/main/java,src/test/java,src/main/resources,src/test/resources

  services:
    instance-service:
      base-url: http://localhost:8001
    user-service:
      base-url: http://localhost:8002
    workspace-service:
      base-url: http://localhost:8003
    email-service:
      base-url: http://localhost:8020
    file-service:
      base-url: http://localhost:8004

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - mappings
          - conditions
          - beans
          - configprops
          - loggers
          - httpexchanges
          - threaddump
          - liquibase
          - flyway
