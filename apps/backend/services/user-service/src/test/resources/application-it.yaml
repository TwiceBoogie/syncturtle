spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    listener:
      auto-startup: false

server:
  port: 0

app:
  auth:
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    password-reset-token-ttl: 30m
    password-reset-token-bytes: 48
  passport:
    issuer: https://api.syncturtle.test/auth
    audience: syncturtle-test
    kid: test-key
