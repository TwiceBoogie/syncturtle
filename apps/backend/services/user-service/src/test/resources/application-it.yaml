spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    listener:
      auto-startup: false

server:
  port: 0

app:
  kafka:
    deployment-id: test
  auth:
    refresh-session:
      successor-envelope:
        encryption-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
      client-binding:
        hmac-key: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8
  passport:
    issuer: https://api.syncturtle.test/auth
    audience: syncturtle-test
    kid: test-key
