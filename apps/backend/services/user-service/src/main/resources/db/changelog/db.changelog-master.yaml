databaseChangeLog:
    - logicalFilePath: db/changelog/db.changelog-master.yaml
    - preConditions:
          - onFail: HALT
          - onError: HALT
          - dbms:
                type: postgresql

    - include:
          file: releases/0001_init/db.changelog.yaml
          relativeToChangelogFile: true

    - include:
          file: releases/0002_create_instances_lite.sql
          relativeToChangelogFile: true

    - include:
          file: releases/0003_adjust_users_for_principals.sql
          relativeToChangelogFile: true

    - include:
          file: releases/0004_seed_system_user.sql
          relativeToChangelogFile: true
