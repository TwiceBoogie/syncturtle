<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Token Expired</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 460px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }

      .eyebrow {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #dc2626;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 12px;
      }

      p {
        line-height: 1.6;
        color: #475569;
      }

      .code {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: #f1f5f9;
        font-size: 13px;
        color: #334155;
      }

      .button {
        display: inline-block;
        margin-top: 24px;
        background: #0f172a;
        color: #ffffff;
        padding: 10px 16px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Request blocked</div>

      <h1>Security token expired</h1>

      <p th:text="${error.message}">
        Security token is invalid or expired.
      </p>

      <p>
        Refresh the page and submit the form again. This can happen when the page
        was open for too long, cookies were cleared, or the form was submitted
        from an old tab.
      </p>

      <div class="code">
        <strong>Error:</strong>
        <span th:text="${error.key}">INVALID_CSRF_TOKEN</span>
        <span th:if="${error.code != null}">
          /
          <span th:text="${error.code}">5012</span>
        </span>
      </div>

      <a class="button" th:href="${homeUrl}">Go back home</a>
    </main>
  </body>
</html>
