spring:
  cloud:
    discovery:
      enabled: false

  thymeleaf:
    cache: false

  main:
    lazy-initialization: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true

  liquibase:
    enabled: true

  kafka:
    listener:
      auto-startup: false
      concurrency: 1
      ack-mode: record
      missing-topics-fatal: false
    consumer:
      auto-offset-reset: earliest

server:
  port: 0

eureka:
  client:
    enabled: false

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    "[org.springframework.kafka]": WARN
    "[org.testcontainers]": INFO
    tc: INFO

app:
  kafka:
    enabled: false
    consumer-group: email-service-it
    config-broadcast-group: email-service-it-config

  email:
    retry:
      scheduler:
        enabled: false

  web:
    access-logging:
      enabled: false
