spring:
  cloud:
    discovery:
      enabled: false
  thymeleaf:
    cache: false
  main:
    lazy-initialization: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
  liquibase:
    enabled: true
  kafka:
    listener:
      auto-startup: false
      concurrency: 1
      ack-mode: record
      missing-topics-fatal: false
    consumer:
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
server:
  port: 0
eureka:
  client:
    enabled: false
management:
  health:
    mail:
      enabled: false
logging:
  level:
    root: INFO
    "[org.springframework.kafka]": WARN
    "[org.testcontainers]": INFO
    tc: INFO
app:
  kafka:
    enabled: false
    consumer-group: email-service-it
    instance-configuration:
      enabled: true
      deployment-id: test
      replica-id: email-it
      local-replica-count: 1
  email:
    inbox:
      scheduler:
        enabled: false
        poll-delay: 10s
    runtime-config-cache:
      ttl: 2m
  web:
    access-logging:
      enabled: false
  clients:
    instance-service:
      base-url: http://localhost:8001
      connect-timeout: 2s
      read-timeout: 5s
