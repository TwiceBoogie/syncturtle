spring:
  cloud:
    discovery:
      enabled: false
  kafka:
    listener:
      auto-startup: false
server:
  port: 0
eureka:
  client:
    enabled: false
app:
  kafka:
    deployment-id: test
    instance-configuration:
      deployment-id: ${app.kafka.deployment-id}
      replica-id: email-test
      local-replica-count: 1
  email:
    inbox:
      scheduler:
        enabled: false
        poll-delay: 10s
    runtime-config-cache:
      ttl: 2m
  clients:
    instance-service:
      base-url: http://localhost:8001
