databaseChangeLog:
  - logicalFilePath: db/changelog/db.changelog-master.yaml
  - preConditions:
      - onFail: HALT
      - onError: HALT
      - dbms:
          type: postgresql

  - include:
      file: releases/0001_init/db.changelog.yaml
      relativeToChangelogFile: true
  - include:
      file: releases/0002_add_uq_index_to_instance_admins.sql
      relativeToChangelogFile: true
  - include:
      file: releases/0003_seed_system_user_lite.sql
      relativeToChangelogFile: true
  - include:
      file: releases/0004_add_workspace_lite.sql
      relativeToChangelogFile: true
  - include:
      file: releases/0005_add_outbox_messages.sql
      relativeToChangelogFile: true
  - include:
      file: releases/0006_add_outbox_trace_context.sql
      relativeToChangelogFile: true
  - include:
      file: env/test/db.changelog-test.yaml
      relativeToChangelogFile: true
