databaseChangeLog:
  - logicalFilePath: db/changelog/db.changelog-master.yaml
  - preConditions:
      - onFail: HALT
      - onError: HALT
      - dbms:
          type: postgresql

  - include:
      file: releases/0001_init/db.changelog.yaml
      relativeToChangelogFile: true
  - include:
      file: releases/0002_add_outbox_messages.sql
      relativeToChangelogFile: true
  - include:
      file: releases/0003_adjust_workspace_member_invites_for_post_auth.sql
      relativeToChangelogFile: true
