map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $request_method $syncturtle_post_method_allowed {
    default 0;
    POST    1;
    OPTIONS 1;
}

map $request_method $syncturtle_get_method_allowed {
    default 0;
    GET     1;
    HEAD    1;
    OPTIONS 1;
}

server {
    listen 80 default_server;
    server_name localhost;

    proxy_intercept_errors on;
    error_page 502 503 504 = @upstream_unavailable;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","component":"nginx"}\n';
    }

    # Presigned path-style POST action. The no-URI proxy_pass preserves the
    # exact bucket path and query string; $http_host preserves SigV4 authority.
    location = /syncturtle {
        if ($syncturtle_post_method_allowed = 0) {
            return 405;
        }

        client_max_body_size 6m;
        client_body_timeout 5m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5m;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Cookie "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass http://minio:9000;
    }

    # Temporary, authorized, version-pinned object retrieval only.
    location ^~ /syncturtle/ {
        if ($syncturtle_get_method_allowed = 0) {
            return 405;
        }

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 5m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Cookie "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass http://minio:9000;
    }

    location = /god-mode {
        return 308 /god-mode/$is_args$args;
    }

    location ^~ /god-mode/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 1h;
        proxy_set_header Cookie "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass http://admin:3000;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass http://api-gateway:8080;
    }

    location /auth/ {
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass http://api-gateway:8080;
    }

    location / {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 1h;
        proxy_set_header Cookie "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass http://web:3000;
    }

    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"error":"upstream_unavailable","message":"SyncTurtle is still starting or an upstream is unavailable"}\n';
    }
}
