spring:
  main:
    web-application-type: none
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/syncturtle_instance
    username: instance_svc
    password: ${INSTANCE_DB_PASSWORD:instance_svc_dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    listener:
      auto-startup: false
    admin:
      fail-fast: true
      auto-create: true

eureka:
  client:
    enabled: false

app:
  kafka:
    enabled: true
    topics:
      create: true
