app:
  kafka:
    enabled: true
    consumer-group: email-service

  email:
    cache-name: emailRuntimeConfig
    cache-ttl: 10m

    retry:
      batch-size: 25
      max-attempts: 8
      initial-delay-ms: 30000
      max-delay-ms: 900000
      scheduler:
        enabled: true
        poll-delay-ms: 10000

    topics:
      email-to-send: ${APP_TOPIC_EMAIL_TO_SEND:email.events.v1}
      email-config-changed: ${APP_TOPIC_EMAIL_CONFIG_CHANGED:instance-config.events.v1}
    sender:
      connection-timeout-ms: 5000
      timeout-ms: 3000
      write-timeout-ms: 5000

  clients:
    instance-service:
      base-url: ${INSTANCE_SERVICE_BASE_URL:http://localhost:8001}
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: 8020

spring:
  application:
    name: email-service

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

    template:
      observation-enabled: true

    listener:
      observation-enabled: true
      auto-startup: ${app.kafka.enabled:true}
      concurrency: 2
      ack-mode: record
      missing-topics-fatal: false

    consumer:
      group-id: ${app.kafka.consumer-group:email-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.syncturtle.*"
        "[spring.json.use.type.headers]": false

    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": true
        "[linger.ms]": 5
        "[batch.size]": 32768
        "[compression.type]": zstd
        "[max.in.flight.requests.per.connection]": 5
        "[spring.json.add.type.headers]": false # JsonSerializer.ADD_TYPE_INFO_HEADERS
        "[interceptor.classes]": com.syncturtle.common.spring.kafka.MdcKafkaHeaderProducerInterceptor
