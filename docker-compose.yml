name: syncturtle

services:
  syncturtle-obs:
    image: grafana/otel-lgtm:0.11.10
    environment:
      GF_SERVER_ROOT_URL: http://localhost:13000
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run ./scripts/init-local-env.sh first}
    volumes:
      - obs-data:/data
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "cat", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  syncturtle-otel:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deployments/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
    networks:
      - internal
      - observability
    depends_on:
      syncturtle-obs:
        condition: service_healthy
    restart: unless-stopped

  otel-ready:
    image: curlimages/curl:8.16.0
    command:
      - /bin/sh
      - -ec
      - |
        attempts=0
        until curl --fail --silent --show-error http://syncturtle-otel:13133/; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "OpenTelemetry Collector did not become ready" >&2
            exit 1
          fi
          sleep 2
        done
    networks:
      - internal
    depends_on:
      syncturtle-otel:
        condition: service_started
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER:-syncturtle_root}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:?Run ./scripts/init-local-env.sh first}
      POSTGRES_DB: postgres
      INSTANCE_DB_PASSWORD: ${INSTANCE_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      INSTANCE_MIGRATOR_DB_PASSWORD: ${INSTANCE_MIGRATOR_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      USER_MIGRATOR_DB_PASSWORD: ${USER_MIGRATOR_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      WORKSPACE_MIGRATOR_DB_PASSWORD: ${WORKSPACE_MIGRATOR_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      FILE_DB_PASSWORD: ${FILE_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      FILE_MIGRATOR_DB_PASSWORD: ${FILE_MIGRATOR_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      EMAIL_DB_PASSWORD: ${EMAIL_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      EMAIL_MIGRATOR_DB_PASSWORD: ${EMAIL_MIGRATOR_DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./scripts/init-local-env.sh first}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  minio:
    build:
      context: ./deployments/minio
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        MINIO_COMMIT_PREFIX: 9e49d5e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run ./scripts/init-local-env.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run ./scripts/init-local-env.sh first}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:3001
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/opt/syncturtle/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run ./scripts/init-local-env.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run ./scripts/init-local-env.sh first}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:?Run ./scripts/init-local-env.sh first}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:?Run ./scripts/init-local-env.sh first}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-syncturtle}
    volumes:
      - ./deployments/minio/init.sh:/opt/syncturtle/init.sh:ro
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  obs-data:
  minio-data:

networks:
  edge:
    name: syncturtle-edge
  internal:
    name: syncturtle-internal
  observability:
    name: syncturtle-observability
